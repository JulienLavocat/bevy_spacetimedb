[package]
name = "bevy_spacetimedb"
description = "Use SpacetimeDB in your Bevy application"
repository = "https://github.com/JulienLavocat/bevy_spacetimedb"
readme = "../README.md"
version = "0.7.2"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["macros"]
macros = ["dep:bevy_spacetimedb_macros", "client"]
server = ["dep:spacetimedb"]
client = ["dep:spacetimedb-sdk", "dep:bevy"]

[dependencies]
spacetimedb = { version = "1.12.1", optional = true }
spacetimedb-sdk = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
bevy_spacetimedb_macros = { version = "0.2.0", optional = true }

[[example]]
name = "bevy_spacetimedb"
path = "../examples/bevy_spacetimedb.rs"
